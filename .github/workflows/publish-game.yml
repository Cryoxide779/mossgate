# Publishes the game (the www folder) to GitHub Pages.
# The Android app loads the game from this address, so every push here updates
# everyone's app the next time they open it. No new Play Store release needed.
name: Publish game update
on:
  push:
    branches: [main]
    paths: ['www/**']
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
