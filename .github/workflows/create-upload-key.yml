# Run this ONCE. It creates the upload key that signs your app for the Play Store
# and gives it to you as a downloadable file. Then follow README step 4.
name: Create upload key (run once)
on:
  workflow_dispatch: {}
jobs:
  key:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate key
        run: |
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -keystore upload.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=MossGate, O=MossGate, C=US"
          base64 -w0 upload.keystore > ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > ANDROID_KEYSTORE_PASSWORD.txt
          printf 'Add these as repository secrets (Settings > Secrets and variables > Actions):\n\nANDROID_KEYSTORE_BASE64   = contents of ANDROID_KEYSTORE_BASE64.txt\nANDROID_KEYSTORE_PASSWORD = contents of ANDROID_KEYSTORE_PASSWORD.txt\n\nKeep upload.keystore and the password somewhere safe and private (a password manager or private cloud folder).\nThen delete this run artifact from GitHub.\n' > README-KEY.txt
      - uses: actions/upload-artifact@v5
        with:
          name: upload-key-KEEP-PRIVATE
          path: |
            upload.keystore
            ANDROID_KEYSTORE_BASE64.txt
            ANDROID_KEYSTORE_PASSWORD.txt
            README-KEY.txt
          retention-days: 1
